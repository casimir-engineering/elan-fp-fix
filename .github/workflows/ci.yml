name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck -S style install.sh diagnose.sh install-driver.sh

      - name: bash syntax check
        run: bash -n install.sh diagnose.sh install-driver.sh

      - name: scripts are executable
        run: test -x install.sh && test -x diagnose.sh && test -x install-driver.sh
