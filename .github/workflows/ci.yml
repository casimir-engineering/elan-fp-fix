name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck -S style install.sh setup-system.sh build-driver.sh diagnose.sh

      - name: bash syntax check
        run: bash -n install.sh setup-system.sh build-driver.sh diagnose.sh

      - name: scripts are executable
        run: test -x install.sh && test -x setup-system.sh && test -x build-driver.sh && test -x diagnose.sh
